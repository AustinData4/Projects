<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Player History</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  background: white;
  padding: 20px 28px 32px;
  border-radius: 10px;
}

h2 {
  margin-top: 0;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 0.9rem;
  table-layout: fixed; /* keeps columns perfectly aligned */
}

th, td {
  border-bottom: 1px solid #ddd;
  padding: 8px;
  text-align: center;
}

th {
  background: #f1f1f1;
  font-weight: bold;
}

th.sortable {
  cursor: pointer;
}

th.sortable::after {
  content: " ⇅";
  font-size: 0.7rem;
  color: #888;
}

.back-btn {
  display: inline-block;
  padding: 8px 14px;
  background: #007bff;
  color: white;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="container">

<a href="PlaceYourBets69.html" class="back-btn">← Back</a>

<h2 id="title"></h2>

<table id="historyTable">
  <thead>
    <tr>
      <th>Date</th>
      <th class="sortable" data-col="type">Type</th>
      <th class="sortable" data-col="opponent">Opponent</th>
      <th class="sortable" data-col="stake">Stake</th>
      <th class="sortable" data-col="score">Score</th>
      <th class="sortable" data-col="winner">Winner</th>
      <th>Status</th>
      <th>Notes</th>
    </tr>
  </thead>
  <tbody id="historyBody"></tbody>
</table>

</div>

<script>
const STORAGE_KEY = "betskiGamesV3";
let games = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

const params = new URLSearchParams(window.location.search);
const player = params.get("name");
document.getElementById("title").textContent =
  player + "'s Full Bet History";

let sortCol = null;
let sortAsc = true;

function loadRows() {
  const body = document.getElementById("historyBody");
  body.innerHTML = "";

  let list = games.filter(
    g => g.player1 === player || g.player2 === player
  );

  if (sortCol) {
    list.sort((a, b) => compare(a, b, sortCol));
    if (!sortAsc) list.reverse();
  }

  list.forEach(g => {
    const opponent =
      g.player1 === player ? g.player2 : g.player1;

    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${g.date || ""}</td>
      <td>${g.gameType || ""}</td>
      <td>${opponent || ""}</td>
      <td>${g.stakes || ""}</td>
      <td>${g.score || ""}</td>
      <td>${g.winner || ""}</td>
      <td>${g.status || ""}</td>
      <td>${g.notes || ""}</td>
    `;
    body.appendChild(row);
  });
}

function compare(a, b, col) {
  let va, vb;

  switch (col) {
    case "type":
      va = a.gameType || "";
      vb = b.gameType || "";
      break;

    case "opponent":
      va = a.player1 === player ? a.player2 : a.player1;
      vb = b.player1 === player ? b.player2 : b.player1;
      break;

    case "stake":
      va = parseFloat(a.amount) || 0;
      vb = parseFloat(b.amount) || 0;
      break;

    case "score":
      va = a.score || "";
      vb = b.score || "";
      break;

    case "winner":
      va = a.winner || "";
      vb = b.winner || "";
      break;

    default:
      return 0;
  }

  if (typeof va === "string") {
    va = va.toLowerCase();
    vb = vb.toLowerCase();
  }

  if (va < vb) return -1;
  if (va > vb) return 1;
  return 0;
}

document.querySelectorAll("th.sortable").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.dataset.col;

    if (sortCol === col) {
      sortAsc = !sortAsc;
    } else {
      sortCol = col;
      sortAsc = true;
    }

    loadRows();
  });
});

loadRows();
</script>

</body>
</html>
